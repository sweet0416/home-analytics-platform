name: PR backend gate

on:
  pull_request:
    paths:
      - "backend/**"
      - "deploy/hash-transport-test/**"
      - "scripts/**"
      - ".github/workflows/pr-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile backend Python
        run: python -m compileall -q backend/app backend/scripts backend/tests
      - name: Ruff maintained backend paths
        run: python -m ruff check backend/app backend/scripts backend/tests
      - name: Focused auth and hardening tests
        run: python -m pytest backend/tests/test_auth.py backend/tests/test_hash_transport_preflight.py
      - name: Full backend tests
        run: python -m pytest backend/tests
      - name: Check Docker Compose availability
        run: docker compose version
      - name: Hash transport preflight
        run: python backend/scripts/check_hash_transport.py
      - name: Hash transport preflight with Python -O
        run: python -O backend/scripts/check_hash_transport.py
      - name: Hash transport preflight with PYTHONOPTIMIZE
        run: PYTHONOPTIMIZE=1 python backend/scripts/check_hash_transport.py
