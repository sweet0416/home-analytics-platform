name: Build and publish GHCR images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: sweet0416
  SOURCE_URL: https://github.com/sweet0416/home-analytics-platform

jobs:
  build:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: home-analytics-platform-backend
            context: ./backend
            file: ./backend/Dockerfile
          - name: frontend
            image: home-analytics-platform-frontend
            context: ./frontend
            file: ./frontend/Dockerfile
          - name: ttskill-agent
            image: home-analytics-platform-ttskill-agent
            context: ./deploy/ttskill-agent
            file: ./deploy/ttskill-agent/Dockerfile

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set build metadata
        id: build-meta
        shell: bash
        run: |
          set -euo pipefail
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          app_version="$(sed -n 's/^HAP_RELEASE_VERSION="\([^"]*\)"$/\1/p' .env.example)"
          test -n "$app_version"
          echo "build_time=$build_time" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.build-meta.outputs.build_time }}
            org.opencontainers.image.version=${{ steps.build-meta.outputs.app_version }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build-meta.outputs.build_time }}
            IMAGE_REFERENCE=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:sha-${{ github.sha }}
            APP_VERSION=${{ steps.build-meta.outputs.app_version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
