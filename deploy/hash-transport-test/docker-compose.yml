# Isolated Portainer Git Stack fixture. Never use as the production hap Stack.
services:
  hash-probe:
    image: hap-hash-hardening-candidate:20260925
    container_name: hap-hash-probe-20260925
    restart: "no"
    environment:
      HAP_ADMIN_PASSWORD_HASH_B64: ${HAP_ADMIN_PASSWORD_HASH_B64:?Set synthetic test hash only}
      HAP_TEST_PASSWORD_B64: ${HAP_TEST_PASSWORD_B64:?Set synthetic test password only}
      APP_DEPLOYMENT_ENVIRONMENT: testing
      DATABASE_URL: sqlite:////app/data/sqlite/hap.db
      BACKUP_AUTO_ENABLED: "false"
      FUND_NAV_AUTO_SYNC_ENABLED: "false"
      FUND_NAV_HISTORY_AUTO_SYNC_ENABLED: "false"
      LOTTERY_DLT_AUTO_SYNC_ENABLED: "false"
      NOTIFICATION_BARK_ENABLED: "false"
      FUND_AI_SUMMARY_ENABLED: "false"
      DOCKER_ENABLED: "false"
      PVE_ENABLED: "false"
    volumes:
      - hap_hash_probe_sqlite_20260925:/app/data/sqlite
    networks:
      - hap_hash_probe_net_20260925

networks:
  hap_hash_probe_net_20260925:
    name: hap_hash_probe_net_20260925

volumes:
  hap_hash_probe_sqlite_20260925:
    name: hap_hash_probe_sqlite_20260925
